<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Sholat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d241b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d241b; --bg-panel:#123528; --gold:#c9a961; --gold-dim:#8a7442;
    --cream:#f3ede0; --cream-dim:#a9bdb0; --line:#2a4d3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg-deep);color:var(--cream);font-family:'Outfit',sans-serif;width:100%;height:100vh;overflow:hidden;}
  .screen{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;}
  header{display:flex;justify-content:space-between;align-items:center;padding:min(4vh,32px) min(5vw,44px);border-bottom:1px solid var(--line);}
  .mosque-name{font-size:clamp(20px,3vw,32px);color:var(--gold);}
  .mosque-name.font-serif{font-family:'Amiri',serif;}
  .mosque-name.font-sans{font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:0.02em;}
  .mosque-sub{font-size:clamp(11px,1.2vw,14px);color:var(--cream-dim);margin-top:2px;}
  .clock-block{text-align:right;}
  .clock{font-size:clamp(32px,6vw,56px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
  .date{font-size:clamp(11px,1.2vw,14px);color:var(--cream-dim);margin-top:6px;}
  main{display:flex;align-items:center;justify-content:center;padding:0 min(5vw,44px);}
  #elJadwal{display:flex;gap:16px;width:100%;max-width:1100px;}
  .prayer-item{flex:1;text-align:center;padding:clamp(16px,3vh,32px) 8px;border-radius:8px;background:var(--bg-panel);border:1px solid var(--line);}
  .prayer-item.active{border-color:var(--gold-dim);background:linear-gradient(180deg, rgba(201,169,97,0.20), rgba(201,169,97,0.05));}
  .prayer-name{font-size:clamp(12px,1.4vw,18px);color:var(--cream-dim);}
  .prayer-item.active .prayer-name{color:var(--gold);}
  .prayer-time{font-size:clamp(22px,3.6vw,44px);font-weight:500;margin-top:8px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<div class="screen">
  <header>
    <div style="display:flex;align-items:center;gap:16px;">
      <img id="elLogo" src="" alt="" style="display:none;height:clamp(36px,5vh,64px);width:auto;">
      <div>
        <div class="mosque-name" id="elNamaMasjid">-</div>
        <div class="mosque-sub" id="elAlamat">-</div>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock" id="elJam">--:--:--</div>
      <div class="date" id="elTanggal">-</div>
    </div>
  </header>
  <main>
    <div id="elJadwal"></div>
  </main>
</div>

<script src="vendor/adhan.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('service-worker.js'));
  }
</script>

</body>
</html>
