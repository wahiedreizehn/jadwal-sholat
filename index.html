<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Sholat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d241b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d241b; --bg-panel:#123528; --gold:#c9a961; --gold-dim:#8a7442;
    --cream:#f3ede0; --cream-dim:#a9bdb0; --line:#2a4d3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg-deep);color:var(--cream);font-family:'Outfit',sans-serif;width:100%;height:100vh;overflow:hidden;}
  .screen{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;}
  header{display:flex;justify-content:space-between;align-items:center;padding:min(4vh,32px) min(5vw,44px);border-bottom:1px solid var(--line);}
  .mosque-name{font-size:clamp(20px,3vw,32px);color:var(--gold);}
  .mosque-name.font-serif{font-family:'Amiri',serif;}
  .mosque-name.font-sans{font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:0.02em;}
  .mosque-sub{font-size:clamp(11px,1.2vw,14px);color:var(--cream-dim);margin-top:2px;}
  .clock-block{text-align:right;}
  .clock{font-size:clamp(32px,6vw,56px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
  .date{font-size:clamp(11px,1.2vw,14px);color:var(--cream-dim);margin-top:6px;}
  main{display:flex;flex-direction:column;gap:16px;padding:0 min(5vw,44px);flex:1;min-height:0;}
  #elJadwal{display:flex;gap:16px;width:100%;max-width:1100px;margin:0 auto;flex-shrink:0;}
  .prayer-item{flex:1;text-align:center;padding:clamp(16px,3vh,32px) 8px;border-radius:8px;background:var(--bg-panel);border:1px solid var(--line);}
  .prayer-item.active{border-color:var(--gold-dim);background:linear-gradient(180deg, rgba(201,169,97,0.20), rgba(201,169,97,0.05));}
  .prayer-name{font-size:clamp(12px,1.4vw,18px);color:var(--cream-dim);}
  .prayer-item.active .prayer-name{color:var(--gold);}
  .prayer-time{font-size:clamp(22px,3.6vw,44px);font-weight:500;margin-top:8px;font-variant-numeric:tabular-nums;}

  .konten-row{width:100%;max-width:1100px;margin:0 auto;display:flex;gap:16px;flex:1;min-height:0;}
  .media-block, .info-block{background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(14px,2.2vh,20px) clamp(16px,2.6vw,26px);}
  .media-block{flex:1.4;padding:0;justify-content:center;align-items:center;}
  .info-block{flex:1;}
  .media-block .ip-media{width:100%;height:100%;object-fit:cover;display:block;border:0;}
  .media-block .ip-empty{color:var(--cream-dim);font-size:clamp(12px,1.4vw,15px);}
  .info-block .ip-label{font-size:clamp(10px,1.1vw,13px);color:var(--gold-dim);letter-spacing:0.06em;margin-bottom:6px;}
  .info-block .ip-title{font-size:clamp(15px,1.8vw,22px);color:var(--gold);font-family:'Amiri',serif;}
  .info-block .ip-desc{font-size:clamp(11px,1.3vw,15px);color:var(--cream-dim);margin-top:4px;}

  .event-badge{display:inline-flex;align-items:center;gap:6px;font-size:clamp(10px,1.1vw,12px);color:var(--gold);background:rgba(201,169,97,0.12);border:1px solid var(--gold-dim);border-radius:20px;padding:3px 10px;margin-top:6px;}

  .ticker-wrap{border-top:1px solid var(--line);background:var(--bg-panel);padding:min(1.6vh,12px) 0;overflow:hidden;white-space:nowrap;}
  .ticker-track{display:inline-block;padding-left:100%;animation:scroll-left 26s linear infinite;font-size:clamp(12px,1.5vw,16px);color:var(--cream);}
  @keyframes scroll-left{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}

  /* ===== OVERLAY: Azan / Iqamah / Jumat ===== */
  .overlay{
    position:fixed;inset:0;background:var(--bg-deep);display:none;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:5vh 5vw;
  }
  .overlay.active{display:flex;}
  .overlay .label{font-size:clamp(14px,1.6vw,20px);letter-spacing:0.08em;color:var(--gold-dim);margin-bottom:10px;}
  .overlay h1{font-family:'Amiri',serif;font-size:clamp(36px,7vw,64px);color:var(--gold);margin-bottom:24px;}
  .overlay .countdown{font-size:clamp(64px,14vw,140px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
  .overlay .countdown-label{margin-top:14px;font-size:clamp(13px,1.5vw,17px);color:var(--cream-dim);}
  .overlay .running-msg{
    margin-top:min(6vh,48px);font-size:clamp(14px,1.8vw,20px);color:var(--cream);
    background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;
    padding:12px 28px;min-width:min(80vw,520px);
  }
  .overlay .jumat-msg{font-size:clamp(18px,2.4vw,28px);color:var(--cream);max-width:70vw;line-height:1.6;}
</style>
</head>
<body>

<div class="screen">
  <header>
    <div style="display:flex;align-items:center;gap:16px;">
      <img id="elLogo" src="" alt="" style="display:none;height:clamp(36px,5vh,64px);width:auto;">
      <div>
        <div class="mosque-name" id="elNamaMasjid">-</div>
        <div class="mosque-sub" id="elAlamat">-</div>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock" id="elJam">--:--:--</div>
      <div class="date" id="elTanggal">-</div>
      <div id="elEventBadge"></div>
    </div>
  </header>
  <main>
    <div id="elJadwal"></div>
    <div class="konten-row">
      <div class="media-block" id="elMediaBlock"></div>
      <div class="info-block" id="elInfoBlock"></div>
    </div>
  </main>
  <div class="ticker-wrap">
    <div class="ticker-track" id="elTicker">-</div>
  </div>
</div>

<!-- Layar Azan -->
<div class="overlay" id="ovAzan">
  <div class="label">WAKTU SHOLAT TELAH TIBA</div>
  <h1 id="ovAzanNama">-</h1>
</div>

<!-- Layar Iqamah -->
<div class="overlay" id="ovIqamah">
  <div class="label" id="ovIqamahNama">MENUJU IQAMAH</div>
  <div class="countdown" id="ovIqamahCountdown">00:00</div>
  <div class="countdown-label">menuju iqamah</div>
  <div class="running-msg" id="ovIqamahPesan">-</div>
</div>

<!-- Layar Mode Jumat -->
<div class="overlay" id="ovJumat">
  <div class="label">HARI JUMAT</div>
  <h1>Shalat Jumat</h1>
  <div class="jumat-msg" id="ovJumatPesan">-</div>
</div>

<audio id="audioAzan" preload="auto"></audio>

<script src="vendor/adhan.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('service-worker.js'));
  }
</script>

</body>
</html>
